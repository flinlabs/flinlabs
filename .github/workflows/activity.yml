name: activity

# Recomputes the Activity numbers and pushes the two SVGs to the `output`
# branch, which README.md points at. Nothing here is committed to main.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the typesetting deps
        run: pip install -r tools/requirements.txt

      - name: Fetch the numbers
        working-directory: tools
        env:
          # the default token sees public contributions. For private ones, add a
          # PAT with read:user as a secret and reference it here instead.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: python3 fetch_activity.py activity.json

      - name: Render
        working-directory: tools
        run: python3 build_activity.py activity.json ../dist

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
