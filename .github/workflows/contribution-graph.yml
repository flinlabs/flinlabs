name: contribution graph

# Redraws the contribution snake in the portfolio palette and pushes the two
# SVGs to the `output` branch, which README.md points at.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-graph
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Generate
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # dots run bg-deep → mint → powder → lav → lav-ink, so the busiest
          # days land on the same lavender the site uses for accents
          outputs: |
            dist/snake-light.svg?color_snake=#1b1a17&color_dots=#eae6dc,#dcebdd,#d9e5f0,#e6dff5,#52468a
            dist/snake-dark.svg?color_snake=#f2efe8&color_dots=#232019,#2f6440,#2f5578,#52468a,#c9bff0

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
