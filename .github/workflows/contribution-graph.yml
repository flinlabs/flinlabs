name: contribution graph

# Redraws the contribution snake in the portfolio palette and pushes the two
# SVGs to the `output` branch, which README.md points at.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-graph
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Generate
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # a sequential ramp in the accent hue: bg-deep for an empty day,
          # then lavender darkening to --lav-ink on the busiest
          outputs: |
            dist/snake-light.svg?color_snake=#1b1a17&color_dots=#eae6dc,#e6dff5,#c3b4e2,#8878bd,#52468a
            dist/snake-dark.svg?color_snake=#f2efe8&color_dots=#232019,#3a3358,#574b8f,#8c7fc4,#c9bff0

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
